<app-page-header
  [title]="editing ? 'Edit hire' : 'Add a new hire'"
  [subtitle]="
    editing
      ? 'Update ' + editing.employeeName + '\u2019s details.'
      : 'Add someone to the onboarding programme.'
  "
/>

<form class="card form" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-custom-input
    formControlName="employeeName"
    variant="compact"
    label="Full name"
    placeholder="e.g. Priya Menon"
    [markRequired]="true"
    [errors]="nameErrors"
    [error]="submitError(form.controls.employeeName, nameErrors)"
  />

  <app-custom-input
    formControlName="employeeAge"
    variant="compact"
    type="number"
    label="Age"
    placeholder="e.g. 28"
    [markRequired]="true"
    [errors]="ageErrors"
    [error]="submitError(form.controls.employeeAge, ageErrors)"
  />

  <div class="select-field">
    <label for="department" class="required">Department</label>
    <select
      id="department"
      formControlName="employeeDepartment"
      [class.invalid]="department.touched && department.invalid"
    >
      <option value="" disabled>Select a department</option>
      @for (name of departments; track name) {
        <option [value]="name">{{ name }}</option>
      }
    </select>
    @if (department.touched && department.invalid) {
      <small role="alert">Choose a department.</small>
    }
  </div>

  <app-custom-input
    formControlName="employeeRole"
    variant="compact"
    label="Job title"
    placeholder="e.g. Frontend Engineer"
    [markRequired]="true"
    [errors]="roleErrors"
    [error]="submitError(form.controls.employeeRole, roleErrors)"
  />

  <div class="buttons">
    <a class="btn" routerLink="/hires">Cancel</a>
    <button type="submit" class="btn btn-primary">{{ editing ? 'Save changes' : 'Add hire' }}</button>
  </div>
</form>
