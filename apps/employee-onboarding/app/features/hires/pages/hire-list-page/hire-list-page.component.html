<app-page-header
  title="New hires"
  subtitle="Search, sort, and manage everyone currently going through onboarding."
/>

<section class="card list-card">
  <app-table-header
    searchPlaceholder="Search by name, department, or role..."
    [canAdd]="true"
    (searchChange)="onSearch($event)"
    (addEmployee)="addHire()"
  />

  <label class="filter">
    <app-custom-checkbox
      [checked]="hideCompleted()"
      ariaLabel="Hide fully onboarded hires"
      (checkedChange)="onHideCompletedChange($event)"
    />
    Hide fully onboarded hires
  </label>

  <app-custom-table
    [rows]="result().items"
    [columns]="columns"
    [currentPage]="result().page"
    [pageSize]="pageSize()"
    [totalItems]="result().totalItems"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    [canEdit]="true"
    [canDelete]="true"
    (pageChange)="requestedPage.set($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSortChange($event)"
    (rowAction)="onRowAction($event)"
  />
</section>

<app-confirm-dialog
  [open]="pendingDelete() !== null"
  title="Remove this hire?"
  [message]="
    pendingDelete()
      ? pendingDelete()!.employeeName + ' and their checklist progress will be permanently removed.'
      : ''
  "
  confirmLabel="Remove"
  (confirmed)="confirmDelete()"
  (cancelled)="pendingDelete.set(null)"
/>
