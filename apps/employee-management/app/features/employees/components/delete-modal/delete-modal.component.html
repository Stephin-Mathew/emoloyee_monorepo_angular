<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-card confirm-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Delete Employee</h3>
      <button type="button" class="close-button" (click)="cancel.emit()">×</button>
    </div>

    <p>
      Are you sure you want to delete <strong>{{ employee?.employeeName }}</strong>?
    </p>

    <div class="modal-actions">
      <button type="button" class="secondary-button" (click)="cancel.emit()">Cancel</button>
      <button type="button" class="danger-button" (click)="confirm.emit(employee ?? null)">Delete</button>
    </div>
  </div>
</div>
