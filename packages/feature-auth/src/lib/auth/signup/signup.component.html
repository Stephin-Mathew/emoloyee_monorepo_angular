<div class="auth-page">

  <!-- Left introduction panel -->

  <section class="auth-intro">

    <div class="intro-content">

      <div class="brand-mark">
        EM
      </div>

      <h1>
        Employee Management
      </h1>

      <p class="intro-heading">
        Keep your team organized and connected.
      </p>

      <p class="intro-description">
        Create your account to manage employee
        information in one simple and organized place.
      </p>

    </div>

  </section>


  <!-- Signup form -->

  <section class="auth-form-section">

    <div class="auth-card">

      <h2>
        Create your account
      </h2>
      <p class="auth-subtitle">
        Enter your details to get started.
      </p>

      <form
        [formGroup]="signupForm"
        (ngSubmit)="onSubmit()"
      >

        <app-custom-input
          label="Name"
          type="text"
          inputId="name"
          placeholder="Enter your name"
          formControlName="name"
          [markRequired]="true"
          [errors]="{ required: 'Name is required.' }"
        ></app-custom-input>

        <app-custom-input
          label="Username"
          type="text"
          inputId="username"
          placeholder="Choose a username"
          formControlName="username"
          [markRequired]="true"
          [errors]="{
            required: 'Username is required.',
            minlength: 'Username must be at least 3 characters.'
          }"
        ></app-custom-input>

        <app-custom-input
          label="Email"
          type="email"
          inputId="email"
          placeholder="Enter your email"
          formControlName="email"
          [markRequired]="true"
          [errors]="{
            required: 'Email is required.',
            email: 'Enter a valid email address.'
          }"
        ></app-custom-input>

        <app-custom-input
          label="Password"
          type="password"
          inputId="password"
          placeholder="Create a password"
          formControlName="password"
          [markRequired]="true"
          [errors]="{
            required: 'Password is required.',
            minlength: 'Password must be at least 6 characters.'
          }"
        ></app-custom-input>

        <app-custom-input
          label="Confirm Password"
          type="password"
          inputId="confirmPassword"
          placeholder="Re-enter your password"
          formControlName="confirmPassword"
          [markRequired]="true"
          [errors]="{ required: 'Please confirm your password.' }"
          [error]="passwordMismatchError"
        ></app-custom-input>


        @if (signupError) {

          <p class="login-error">
            {{ signupError }}
          </p>

        }


        <button
          type="submit"
          [disabled]="signupForm.invalid"
        >
          Create Account
        </button>

      </form>


      <p class="auth-link">

        Already have an account?

        <a routerLink="/login">
          Login
        </a>

      </p>

    </div>

  </section>

</div>
